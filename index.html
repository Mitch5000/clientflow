  <head>

    <title>Clientflow — Project Management</title>

    <meta name="theme-color" content="#141219">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html { background: #141219; }
      body { font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif !important; }
      ::selection { background: #4f4665; color: #ede9e3; }
      /* varied radii - one uniform radius everywhere reads as templated */
      .rounded-2xl { border-radius: 12px !important; }
      .rounded-xl { border-radius: 9px !important; }
      .rounded-lg { border-radius: 7px !important; }
      /* warm scrollbars instead of OS default */
      * { scrollbar-width: thin; scrollbar-color: #3d3749 transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: #2e2938; border-radius: 6px; border: 2px solid #141219; }
      *::-webkit-scrollbar-thumb:hover { background: #3d3749; }
      /* visible keyboard focus - a real product cares about this */
      :focus-visible { outline: 2px solid #6a6186; outline-offset: 1px; }
      input, textarea, select { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
